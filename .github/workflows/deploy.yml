name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline run at a time, and never cancel one mid-way
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  # 1. Build once: test and package. Both stages deploy this exact package.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Package release
        run: tar -czf release.tar.gz package.json src
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  # 2. Stage 1: Development. Goes live automatically after build.
  #    Uses the "development" environment and its own secrets.
  deploy-development:
    needs: build
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release

      # DEMO ONLY: the database server is a Postgres container.
      # In the real setup this is the client's managed database.
      - name: "[DEMO DB] Start Postgres"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD is empty or missing in the 'development' environment"
            exit 1
          fi
          docker run -d --name demo-db \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=app \
            -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            if docker exec demo-db pg_isready -h 127.0.0.1 -U postgres -d app > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs demo-db
          echo "ERROR: Postgres did not become ready"
          exit 1

      # DEMO ONLY: mock server. Replace with the real droplet later.
      # The "deploy" user owns /srv/app and nothing else: no sudo.
      - name: "[MOCK SERVER] Create SSH server with restricted deploy user"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ERROR: DEPLOY_SSH_KEY is empty or missing in the 'development' environment"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server postgresql-client
          sudo systemctl start ssh

          sudo useradd -m -s /bin/bash deploy
          sudo usermod -p '*' deploy
          sudo mkdir -p /srv/app/releases
          sudo chown -R deploy:deploy /srv/app

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          sudo mkdir -p /home/deploy/.ssh
          ssh-keygen -y -f ~/.ssh/deploy_key | sudo tee /home/deploy/.ssh/authorized_keys > /dev/null
          sudo chown -R deploy:deploy /home/deploy/.ssh
          sudo chmod 700 /home/deploy/.ssh
          sudo chmod 600 /home/deploy/.ssh/authorized_keys

          ssh-keyscan localhost >> ~/.ssh/known_hosts

      - name: Check deploy user has no admin rights
        run: |
          if ssh -i ~/.ssh/deploy_key deploy@localhost "sudo -n true" 2>/dev/null; then
            echo "FAIL: deploy user has sudo"
            exit 1
          fi
          echo "OK: deploy user cannot use sudo"

      # Migrations run in the pipeline, never by hand.
      - name: Run database migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: app
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());"
          for f in migrations/*.sql; do
            name=$(basename "$f")
            done_already=$(psql -tA -c "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
            if [ "$done_already" = "1" ]; then
              echo "skip  $name (already applied)"
              continue
            fi
            echo "apply $name"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f" -c "INSERT INTO schema_migrations (filename) VALUES ('$name')"
          done
          echo "--- tables now in the database ---"
          psql -c "\dt"

      - name: Upload release to server
        run: scp -i ~/.ssh/deploy_key release.tar.gz deploy@localhost:/srv/app/

      - name: Activate release
        run: |
          ssh -i ~/.ssh/deploy_key deploy@localhost bash -s "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          REL=/srv/app/releases/$1
          mkdir -p "$REL"
          tar -xzf /srv/app/release.tar.gz -C "$REL"
          ln -sfn "$REL" /srv/app/current
          echo "Deployed commit $1"
          ls -la /srv/app/current/
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key deploy@localhost "test -f /srv/app/current/src/index.js && echo 'Release is live in development'"

  # 3. Stage 2: Production. Only starts after development succeeded,
  #    then pauses until the required reviewers approve.
  deploy-production:
    needs: deploy-development
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release

      # DEMO ONLY: the database server is a Postgres container.
      # In the real setup this is the client's managed database.
      - name: "[DEMO DB] Start Postgres"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD is empty or missing in the 'production' environment"
            exit 1
          fi
          docker run -d --name demo-db \
            -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=app \
            -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            if docker exec demo-db pg_isready -h 127.0.0.1 -U postgres -d app > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs demo-db
          echo "ERROR: Postgres did not become ready"
          exit 1

      # DEMO ONLY: mock server. Replace with the real droplet later.
      # The "deploy" user owns /srv/app and nothing else: no sudo.
      - name: "[MOCK SERVER] Create SSH server with restricted deploy user"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ERROR: DEPLOY_SSH_KEY is empty or missing in the 'production' environment"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server postgresql-client
          sudo systemctl start ssh

          sudo useradd -m -s /bin/bash deploy
          sudo usermod -p '*' deploy
          sudo mkdir -p /srv/app/releases
          sudo chown -R deploy:deploy /srv/app

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          sudo mkdir -p /home/deploy/.ssh
          ssh-keygen -y -f ~/.ssh/deploy_key | sudo tee /home/deploy/.ssh/authorized_keys > /dev/null
          sudo chown -R deploy:deploy /home/deploy/.ssh
          sudo chmod 700 /home/deploy/.ssh
          sudo chmod 600 /home/deploy/.ssh/authorized_keys

          ssh-keyscan localhost >> ~/.ssh/known_hosts

      - name: Check deploy user has no admin rights
        run: |
          if ssh -i ~/.ssh/deploy_key deploy@localhost "sudo -n true" 2>/dev/null; then
            echo "FAIL: deploy user has sudo"
            exit 1
          fi
          echo "OK: deploy user cannot use sudo"

      # Migrations run in the pipeline, never by hand.
      - name: Run database migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: app
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());"
          for f in migrations/*.sql; do
            name=$(basename "$f")
            done_already=$(psql -tA -c "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
            if [ "$done_already" = "1" ]; then
              echo "skip  $name (already applied)"
              continue
            fi
            echo "apply $name"
            psql -v ON_ERROR_STOP=1 --single-transaction -f "$f" -c "INSERT INTO schema_migrations (filename) VALUES ('$name')"
          done
          echo "--- tables now in the database ---"
          psql -c "\dt"

      - name: Upload release to server
        run: scp -i ~/.ssh/deploy_key release.tar.gz deploy@localhost:/srv/app/

      - name: Activate release
        run: |
          ssh -i ~/.ssh/deploy_key deploy@localhost bash -s "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          REL=/srv/app/releases/$1
          mkdir -p "$REL"
          tar -xzf /srv/app/release.tar.gz -C "$REL"
          ln -sfn "$REL" /srv/app/current
          echo "Deployed commit $1"
          ls -la /srv/app/current/
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key deploy@localhost "test -f /srv/app/current/src/index.js && echo 'Release is live in production'"