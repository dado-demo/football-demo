name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One pipeline run at a time, and never cancel one mid-way
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  # 1. Build once: test and package. Both stages deploy this exact package.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Package release
        run: tar -czf release.tar.gz package.json src
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  # 2. Stage 1: Development. Goes live automatically after build.
  #    Uses the "development" environment and its own secrets.
  deploy-development:
    needs: build
    uses: ./.github/workflows/deploy-job.yml
    with:
      environment: development

  # 3. Stage 2: Production. Only starts after development succeeded,
  #    then pauses until the required reviewers approve.
  deploy-production:
    needs: deploy-development
    uses: ./.github/workflows/deploy-job.yml
    with:
      environment: production